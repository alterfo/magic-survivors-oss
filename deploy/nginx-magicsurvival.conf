# nginx: https://game.example.com — Unity Web-сборка из /srv/magicsurvival/dist (сертификат certbot)
server {
  listen 80;
  server_name game.example.com;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name game.example.com;
  ssl_certificate /etc/letsencrypt/live/game.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  root /srv/magicsurvival/dist;
  index index.html;

  # страница и загрузчик всегда сверяются с сервером
  location = /index.html { add_header Cache-Control no-cache; }
  location ~ \.loader\.js$ { add_header Cache-Control no-cache; }

  # файлы Unity уже сжаты gzip: отдаём как есть с Content-Encoding, повторно не жмём
  # имена файлов сборки одни и те же от версии к версии: no-cache = сверка по ETag (304), иначе после выкладки
  # браузер смешивает новый загрузчик со старым wasm/data из кэша и игра падает
  location ~ \.wasm\.unityweb$ { gzip off; default_type application/wasm; add_header Content-Encoding gzip; add_header Cache-Control "no-cache"; }
  location ~ \.js\.unityweb$ { gzip off; default_type application/javascript; add_header Content-Encoding gzip; add_header Cache-Control "no-cache"; }
  location ~ \.unityweb$ { gzip off; default_type application/octet-stream; add_header Content-Encoding gzip; add_header Cache-Control "no-cache"; }

  # идеи и голосование игроков — server/ideas.py (systemd magicsurvival-ideas)
  location /api/ { proxy_pass http://127.0.0.1:8797; proxy_set_header X-Real-IP $remote_addr; client_max_body_size 128k; }

  # кооператив: WebSocket-комнаты на двоих — server/coop.py (systemd magicsurvival-coop)
  location = /coop {
    proxy_pass http://127.0.0.1:8798;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }

  # без SPA-фоллбэка: потерянный файл сборки должен давать 404, а не index.html
  location / { try_files $uri $uri/ =404; }
}
